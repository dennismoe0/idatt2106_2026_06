name: Feature / User Story
description: New functionality to implement
labels: ["feature"]
body:
  - type: input
    id: story
    attributes:
      label: User story reference
      placeholder: "US-05 — Fullføre oppgave: Nyhetskvartalet"

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: What needs to be built and why
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Backend
        - Both
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: sprint
    attributes:
      label: Sprint
      options:
        - S1
        - S2
        - S3
