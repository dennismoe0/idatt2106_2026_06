spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${DB_NAME:nettdetektivene}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:apppassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 60000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
      hibernate.connection.characterEncoding: UTF-8
      hibernate.connection.useUnicode: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-at-least-64-characters-long!}
    expiration-ms: 86400000
  cors:
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB
