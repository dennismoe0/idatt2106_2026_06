spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:nettdetektivene}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:apppassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-long}
    expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
